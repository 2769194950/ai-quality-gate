name: Quality Live OCR

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to review with live OpenCodeReview
        required: true
        default: review
        type: choice
        options:
          - requirements
          - design
          - build
          - review
          - verify
          - all

permissions:
  contents: read

concurrency:
  group: quality-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QGATE_ENTRY: packages/qgate/bin/qgate.mjs
  QGATE_CONFIG: qgate.config.json
  REQUESTED_STAGE: ${{ inputs.stage || 'all' }}
  OCR_CLI_VERSION: '1.12.8'
  OCR_LLM_URL: ${{ vars.OCR_BASE_URL }}
  OCR_LLM_MODEL: ${{ vars.OCR_MODEL }}
  # The live provider uses an OpenAI-compatible Chat Completions endpoint.
  OCR_USE_ANTHROPIC: 'false'
  NO_COLOR: '1'

jobs:
  live:
    name: live-ocr
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90
    environment:
      name: ocr-live
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Initialize current-run evidence
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/live-stage.mjs init "$REQUESTED_STAGE"
      - name: Install pinned OpenCodeReview CLI
        if: env.REQUESTED_STAGE != 'build'
        run: |
          npm install --global --force "@alibaba-group/open-code-review@${OCR_CLI_VERSION}"
          actual_version="$(ocr --version | sed -n '1s/.*v\([0-9][0-9.]*\).*/\1/p')"
          test "$actual_version" = "${OCR_CLI_VERSION}"
      - name: Configure provider compatibility defaults
        if: env.REQUESTED_STAGE != 'build'
        env:
          OCR_LLM_URL: ${{ vars.OCR_BASE_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_MODEL }}
          OCR_USE_ANTHROPIC: 'false'
        run: |
          # Mirror the official OCR Action's non-interactive provider setup.
          # The token is referenced by command, never written into config.
          ocr config unset provider
          ocr config set llm.auth_token ""
          ocr config set llm.extra_headers ""
          ocr config set llm.retry_codes ""
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.model "$OCR_LLM_MODEL"
          ocr config set llm.use_anthropic "$OCR_USE_ANTHROPIC"
          ocr config set llm.protocol openai
          ocr config set llm.auth_header ""
          ocr config set llm.auth_token_cmd 'printf "%s" "$OCR_LLM_TOKEN"'
          # Provider-side thinking is disabled explicitly for stable agent calls.
          ocr config set llm.extra_body '{"thinking":{"type":"disabled"}}'
      - name: Preflight live Chat Completions without logging response
        if: env.REQUESTED_STAGE != 'build'
        env:
          OCR_LLM_URL: ${{ vars.OCR_BASE_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_MODEL }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          payload='{"model":"'"${OCR_LLM_MODEL}"'","messages":[{"role":"user","content":"Reply with OK."}],"max_tokens":1}'
          http_status=''
          curl_exit=0
          for attempt in 1 2; do
            set +e
            http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 90 \
              --header "Authorization: Bearer ${OCR_LLM_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload" "$OCR_LLM_URL")"
            curl_exit=$?
            set -e
            if [ "$curl_exit" -eq 0 ]; then break; fi
            if [ "$curl_exit" -eq 28 ] && [ "$attempt" -eq 1 ]; then
              echo 'Live provider preflight timed out without an HTTP response; retrying once'
              sleep 15
              continue
            fi
            echo "Live provider preflight failed before receiving an HTTP response (curl_exit=${curl_exit})"
            exit 3
          done
          echo "Live provider preflight HTTP status=${http_status}"
          case "$http_status" in
            2??) ;;
            401) echo 'Live provider rejected the credential (HTTP 401)'; exit 3 ;;
            403) echo 'Live provider rejected access to the endpoint or model (HTTP 403)'; exit 3 ;;
            404) echo 'Live provider endpoint was not found (HTTP 404)'; exit 3 ;;
            429) echo 'Live provider rate limit or quota was reached (HTTP 429)'; exit 3 ;;
            5??) echo "Live provider service returned HTTP ${http_status}"; exit 3 ;;
            *) echo "Live provider rejected the preflight request (HTTP ${http_status})"; exit 3 ;;
          esac
      - name: Prepare requirements inputs and deterministic gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'requirements'
        run: node tools/ci/live-stage.mjs prepare requirements
      - name: Run live OCR for requirements
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'requirements'
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_AUTH_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/live-stage.mjs run requirements
      - name: Ingest requirements and enforce stage gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'requirements'
        run: node tools/ci/live-stage.mjs ingest requirements
      - name: Prepare design inputs and deterministic gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'design'
        run: node tools/ci/live-stage.mjs prepare design
      - name: Run live OCR for design
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'design'
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_AUTH_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/live-stage.mjs run design
      - name: Ingest design and enforce stage gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'design'
        run: node tools/ci/live-stage.mjs ingest design
      - name: Build and test deterministically
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'build'
        run: node tools/ci/live-stage.mjs build
      - name: Prepare review inputs and deterministic gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'review'
        run: node tools/ci/live-stage.mjs prepare review
      - name: Run live OCR for review
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'review'
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_AUTH_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/live-stage.mjs run review
      - name: Ingest review and enforce stage gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'review'
        run: node tools/ci/live-stage.mjs ingest review
      - name: Prepare verify inputs and deterministic gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'verify'
        run: node tools/ci/live-stage.mjs prepare verify
      - name: Run live OCR for verify
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'verify'
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_AUTH_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/live-stage.mjs run verify
      - name: Ingest verify and enforce stage gates
        if: env.REQUESTED_STAGE == 'all' || env.REQUESTED_STAGE == 'verify'
        run: node tools/ci/live-stage.mjs ingest verify
      - name: Authoritative deterministic verdict
        run: node tools/ci/live-stage.mjs finish
      - name: Remove raw OCR response and temporary context
        if: always()
        run: rm -rf .qgate/tmp/ocr
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qgate-evidence-live
          path: |
            .qgate/evidence/ai/
            verification/evidence/
            verification/reports/
            verification/trace-matrix.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
